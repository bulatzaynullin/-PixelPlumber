<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>PIXEL PLUMBER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;touch-action:none}

#startScreen{position:fixed;inset:0;background:#0b0b1a;z-index:10000;display:flex;justify-content:center;align-items:center;flex-direction:column;padding:20px;text-align:center;color:#ffd966}
#startScreen.hidden{display:none}
#startScreen h1{font-size:28px;margin-bottom:8px;color:#ff6b6b;text-shadow:0 0 10px #ff6b6b}
#startScreen h2{font-size:18px;margin-bottom:30px;color:#ffd966}
#startScreen .icon{font-size:50px;margin-bottom:20px}
#startScreen button{margin:8px;padding:14px 28px;font-size:16px;font-weight:bold;background:#2a2a4a;color:#ffd966;border:3px solid #5a5a8e;border-radius:10px;font-family:'Courier New',monospace;cursor:pointer;box-shadow:0 4px 0 #0f0f1f;min-width:240px}
#startScreen button:active{transform:translateY(4px);box-shadow:none;background:#3a3a6a}
#startScreen .small{font-size:12px;color:#aaaaff;margin-top:20px}

#rotateHint{display:none;position:fixed;inset:0;background:#0b0b1a;color:#ffd966;z-index:9999;justify-content:center;align-items:center;flex-direction:column;text-align:center;padding:20px;font-size:16px;line-height:1.6}
#rotateHint.show{display:flex}
#rotateHint .icon{font-size:64px;margin-bottom:20px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}

.game-wrapper{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;width:100%;height:100%;max-width:100vw;max-height:100vh;justify-content:center;position:relative}
@media(orientation:landscape){.game-wrapper{flex-direction:column;gap:8px;padding:6px}}
.game-area{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;height:100%;justify-content:center}

canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;border:3px solid #3a3a5e;border-radius:6px;background:#0b0b1a;box-shadow:0 0 15px rgba(255,215,0,.2);max-width:100%;max-height:100%}

/* --- КНОПКИ УПРАВЛЕНИЯ --- */
.controls{display:flex;justify-content:space-between;width:100%;gap:10px;padding:0 4px;align-items:center}

@media(orientation:portrait){
    .controls{flex-direction:row;align-items:center;justify-content:space-around}
    .dpad{display:flex;gap:10px;align-items:center}
    .controls-right{display:flex;flex-direction:row;gap:10px;align-items:center}
    .top-slot{display:none} /* прячем паузу в портрете, она будет отдельно */
    .pause-float{display:block;position:absolute;top:10px;right:10px;z-index:100}
}

@media(orientation:landscape){
    .controls{position:absolute;inset:0;pointer-events:none;display:block;width:100%;height:100%;padding:0}
    .dpad{
        position:absolute;
        left:20px;
        bottom:20px;
        display:flex;
        flex-direction:row;
        gap:15px;
        pointer-events:auto;
    }
    .controls-right{
        position:absolute;
        right:20px;
        bottom:20px;
        display:flex;
        flex-direction:row;
        gap:15px;
        pointer-events:auto;
        align-items:center;
    }
    .top-slot{display:none}
    .pause-float{display:block;position:absolute;top:15px;right:15px;pointer-events:auto}
}

.btn{
    background:#2a2a4a;border:3px solid #5a5a8e;color:#ffd966;
    font-size:24px;font-weight:bold;width:65px;height:65px;border-radius:12px;
    display:flex;justify-content:center;align-items:center;cursor:pointer;
    box-shadow:0 4px 0 #0f0f1f;transition:all .05s;touch-action:manipulation;
    font-family:'Courier New',monospace;
}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:none;background:#3a3a6a}
.btn.jump{background:#4a2a2a;border-color:#8e5a5a;color:#ffb347;width:75px;height:75px;font-size:28px}
.btn.jump:active,.btn.jump.pressed{background:#6a3a3a}
.btn.pause{background:#3a3a4a;border-color:#6a6a8a;width:50px;height:50px;font-size:20px;line-height:1}

.hud{
    color:#ffd966;font-size:11px;font-weight:bold;letter-spacing:1px;
    text-shadow:0 0 5px #ffd96688;display:flex;gap:10px;background:#1a1a2e;
    padding:4px 12px;border-radius:15px;border:2px solid #3a3a5e;
    flex-wrap:wrap;justify-content:center;z-index:10;
}
.hud span{color:#ff6b6b}
.hud .score-span{color:#8acd8a}
.hud .record-span{color:#cdcd8a}
.hidden{display:none!important}

@media(orientation:landscape) and (max-height:500px){
    .btn{width:55px;height:55px;font-size:20px}
    .btn.jump{width:68px;height:68px;font-size:24px}
    .btn.pause{width:44px;height:44px;font-size:18px}
    .hud{font-size:10px;padding:3px 10px;gap:8px}
}
</style>
</head>
<body>

<div id="startScreen">
    <div class="icon">🎮</div>
    <h1>PIXEL PLUMBER</h1>
    <h2>Выберите режим игры</h2>
    <button id="btnRotate">📱 Повернуть горизонтально</button>
    <button id="btnAsIs">▶ Играть как есть (вертикально)</button>
    <div class="small">«Повернуть» покажет подсказку в портретном режиме</div>
</div>

<div id="rotateHint">
    <div class="icon">📱</div>
    <div>Поверните телефон горизонтально<br>для лучшего игрового опыта</div>
</div>

<div class="game-wrapper">
    <button class="btn pause pause-float hidden" id="pauseBtnFloat">❚❚</button>
    
    <div class="game-area">
        <div class="hud" id="hud">
            <div>УР: <span id="levelDisplay">1</span>/10</div>
            <div>МОН: <span id="coinDisplay">0</span></div>
            <div>ЖИЗНИ: <span id="livesDisplay">3</span></div>
            <div>ОЧКИ: <span class="score-span" id="scoreDisplay">0</span></div>
            <div>РЕКОРД: <span class="record-span" id="recordDisplay">0</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    
    <div class="controls" id="controls">
        <div class="dpad">
            <button class="btn" id="leftBtn">◀</button>
            <button class="btn" id="rightBtn">▶</button>
        </div>
        <div class="controls-right">
            <button class="btn jump" id="jumpBtn">⬆</button>
            <div class="top-slot"></div>
        </div>
    </div>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const levelDisplay=document.getElementById('levelDisplay');
const coinDisplay=document.getElementById('coinDisplay');
const livesDisplay=document.getElementById('livesDisplay');
const scoreDisplay=document.getElementById('scoreDisplay');
const recordDisplay=document.getElementById('recordDisplay');
const hud=document.getElementById('hud');
const controls=document.getElementById('controls');
const startScreen=document.getElementById('startScreen');
const rotateHint=document.getElementById('rotateHint');

let orientationMode='ask';

document.getElementById('btnRotate').addEventListener('click',()=>{
    orientationMode='rotate';startScreen.classList.add('hidden');checkOrientation();initAudio();
});
document.getElementById('btnAsIs').addEventListener('click',()=>{
    orientationMode='asis';startScreen.classList.add('hidden');rotateHint.classList.remove('show');initAudio();
});

function checkOrientation(){
    if(orientationMode==='rotate'&&window.innerHeight>window.innerWidth&&window.innerWidth<900){
        rotateHint.classList.add('show');
    }else{rotateHint.classList.remove('show');}
}
window.addEventListener('resize',checkOrientation);
window.addEventListener('orientationchange',()=>setTimeout(checkOrientation,100));

// ===== ФИЗИКА =====
const TILE=40,GRAVITY=.5,JUMP_FORCE=-14.5,MOVE_SPEED=2.8,MAX_FALL=14,ENEMY_SPEED=1.2;
const VIEW_W=800,VIEW_H=400;
let camera={x:0,y:0,shakeX:0,shakeY:0,shakeTimer:0,shakeIntensity:0};

let currentLevel=0,coinsCollected=0,lives=3,score=0;
let record=parseInt(localStorage.getItem('pixel_plumber_record')||'0');
let gameState='menu',previousState='menu',menuButtons=[];
const SPAWN_X=80,SPAWN_Y=360-36;
let checkpoint={x:SPAWN_X,y:SPAWN_Y};

let player={
    x:SPAWN_X,y:SPAWN_Y,w:28,h:36,vx:0,vy:0,onGround:true,
    facing:1,animTimer:0,finished:false,invulnerable:0,dead:false,
    starTimer:0,speedTimer:0,jumpCount:0
};
const keys={left:false,right:false,jump:false};
let jumpBuffer=0;

// ===== ЧАСТИЦЫ =====
let particles=[];
function spawnParticles(x,y,color,count,speed,life){
    for(let i=0;i<count;i++){
        const a=Math.random()*Math.PI*2,sp=Math.random()*speed+1;
        particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life,maxLife:life,color,size:Math.random()*3+2});
    }
}
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.97;p.life--;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawParticles(){
    for(const p of particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x-camera.x-p.size/2,p.y-camera.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
}
let floatTexts=[];
function spawnFloatText(x,y,text,color){floatTexts.push({x,y,text,color:color||'#ffd966',life:40,maxLife:40});}
function updateFloatTexts(){
    for(let i=floatTexts.length-1;i>=0;i--){
        floatTexts[i].y-=1;floatTexts[i].life--;
        if(floatTexts[i].life<=0)floatTexts.splice(i,1);
    }
}
function drawFloatTexts(){
    for(const ft of floatTexts){
        ctx.globalAlpha=ft.life/ft.maxLife;
        ctx.fillStyle=ft.color;ctx.font='bold 16px "Courier New"';ctx.textAlign='center';
        ctx.fillText(ft.text,ft.x-camera.x,ft.y-camera.y);
    }
    ctx.globalAlpha=1;
}

// ===== ЗВУКИ =====
let audioCtx=null,soundEnabled=true,musicInterval=null;
function initAudio(){
    if(!audioCtx){
        try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
        catch(e){soundEnabled=false;}
    }
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function playTone(freq,duration,type,volume,slideTo){
    if(!soundEnabled||!audioCtx)return;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type=type||'square';
    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
    if(slideTo)osc.frequency.exponentialRampToValueAtTime(slideTo,audioCtx.currentTime+duration);
    gain.gain.setValueAtTime(volume||.1,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start();osc.stop(audioCtx.currentTime+duration);
}
function sfxJump(){playTone(300,.15,'square',.08,600);}
function sfxCoin(){playTone(988,.08,'square',.08);setTimeout(()=>playTone(1319,.15,'square',.08),80);}
function sfxStomp(){playTone(200,.1,'sawtooth',.1,100);}
function sfxDeath(){playTone(400,.15,'square',.1);setTimeout(()=>playTone(300,.15,'square',.1),150);setTimeout(()=>playTone(200,.3,'square',.1),300);}
function sfxLevelComplete(){playTone(523,.12,'square',.09);setTimeout(()=>playTone(659,.12,'square',.09),120);setTimeout(()=>playTone(784,.12,'square',.09),240);setTimeout(()=>playTone(1047,.3,'square',.09),360);}
function sfxCheckpoint(){playTone(659,.1,'triangle',.08);setTimeout(()=>playTone(880,.2,'triangle',.08),100);}
function sfxBump(){playTone(150,.08,'square',.08);}
function sfxPowerup(){playTone(523,.08,'square',.1);setTimeout(()=>playTone(659,.08,'square',.1),80);setTimeout(()=>playTone(784,.08,'square',.1),160);setTimeout(()=>playTone(1047,.2,'square',.1),240);}
function sfxBoss(){playTone(100,.3,'sawtooth',.12);}
function sfxWin(){playTone(523,.15,'square',.12);setTimeout(()=>playTone(659,.15,'square',.12),150);setTimeout(()=>playTone(784,.15,'square',.12),300);setTimeout(()=>playTone(1047,.5,'square',.12),450);}

const musicNotes=[262,330,392,330,262,330,392,523,392,330,262,330,392,330,262,196];
let musicIndex=0;
function startMusic(){
    if(!soundEnabled||!audioCtx||musicInterval)return;
    musicInterval=setInterval(()=>{
        if(gameState==='playing'&&!player.dead){
            playTone(musicNotes[musicIndex%musicNotes.length],.12,'triangle',.02);
            musicIndex++;
        }
    },220);
}
function stopMusic(){if(musicInterval){clearInterval(musicInterval);musicInterval=null;}}

// ===== УРОВНИ =====
// Символы: 1=блок, 2=монета, 3=цель, 4=гриб, 5=чекпоинт,
// 6=бонус-жизнь, 7=бонус-звезда, 8=бонус-ускорение, 9=ёжик, a=летун, B=босс
// Уровни 7-10 удлинены до 32 тайлов и усложнены
const LEVELS=[
[
"..............................",
"..............................",
"..............................",
"..............................",
"..............................",
".....................222......",
"..............................",
"..............................",
"..2..........2............3...",
"111111111111111111111111111111"
],
[
"..............................",
"..............................",
"..............................",
"..........22..................",
".........1111.................",
"..............................",
"....22.........22........22...",
"...1111.......1111......1111..",
".2........6....5..........2.3.",
"111111111111111111111111111111"
],
[
"..............................",
"..............................",
"..............................",
"..........222.................",
".........11111................",
"..............................",
"..............................",
"..2...4.......4......5...2..3.",
"..1...1.......1.......1.......",
"111111111111111111111111111111"
],
[
"..............................",
"..............................",
"...........22.................",
"..........1111................",
"..............................",
"....22.......4....22..........",
"...1111.....111..111....5.....",
"..............................",
".....4.....4..............2.3.",
"111111111111111111111111111111"
],
[
"..............................",
"..............................",
"..............................",
".........222..................",
"........11111.................",
"..............................",
"..............................",
"...9....4......9....5....2..3.",
"..11..111..11.111...11........",
"111111111111111111111111111111"
],
[
"..............................",
"..............................",
".........a.........a..........",
"..............................",
"..........22..................",
".........1111.................",
"..............................",
"....a.......4.....a......2..3.",
"..22...5...111..111..22.......",
"111111111111111111111111111111"
],
// 7 - удлинён
[
"................................",
"................................",
"..........222...................",
".........11111..................",
"................................",
".....7........8.....7...........",
"...1111......1111...1111........",
"................................",
".2...9...5...4...9....4....2..3.",
"11111111111111111111111111111111"
],
// 8 - удлинён
[
"................................",
"..............a.................",
"..........222...................",
".........1111........a..........",
"................................",
"....4...9....4....9....4........",
"...11..111..11...111..11........",
"................................",
".2....5......6......2......2..3.",
"11111111111111111111111111111111"
],
// 9 - удлинён
[
"................................",
"..........a.........a...........",
"..........222...................",
".........1111...................",
"................................",
"...4...9.....8....9...4.........",
"..11..111..1111..111..11........",
"................................",
".2..7..5..4..6..9..2..2..2..2..3.",
"11111111111111111111111111111111"
],
// 10 - Босс (удлинён)
[
"................................",
"................................",
"..........222...................",
".........11111..................",
"................................",
"....7.........8.................",
"...111.......111................",
"................................",
"..2...5.....4...........B....3..",
"11111111111111111111111111111111"
]
];

let blocks=[],bonusBlocks=[],coinItems=[],enemies=[],flyingEnemies=[],hedgehogs=[],boss=null,checkpoints=[],goal={x:0,y:0,w:TILE,h:TILE},levelWidth=800;

function loadLevel(index){
    const map=LEVELS[index];
    blocks=[];bonusBlocks=[];coinItems=[];enemies=[];flyingEnemies=[];hedgehogs=[];
    boss=null;checkpoints=[];gameState='playing';
    levelWidth=map[0].length*TILE;

    // Сначала парсим обычные блоки
    for(let row=0;row<map.length;row++){
        for(let col=0;col<map[row].length;col++){
            const ch=map[row][col],x=col*TILE,y=row*TILE;
            if(ch==='1')blocks.push({x,y,w:TILE,h:TILE,type:'normal'});
        }
    }

    for(let row=0;row<map.length;row++){
        for(let col=0;col<map[row].length;col++){
            const ch=map[row][col],x=col*TILE,y=row*TILE;
            if(ch==='1')continue;
            if(ch==='2'){
                coinItems.push({x:x+8,y:y+8,w:TILE-16,h:TILE-16,collected:false,animTimer:Math.random()*Math.PI*2});
            }else if(ch==='3'){
                goal={x,y,w:TILE,h:TILE};
            }else if(ch==='4'){
                if(Math.abs(x-SPAWN_X)<80)continue;
                enemies.push({x:x+5,y:y+TILE-28,w:30,h:28,vx:-ENEMY_SPEED,vy:0,alive:true,squashTimer:0});
            }else if(ch==='5'){
                checkpoints.push({x:x+TILE/2-4,y:y+TILE-60,w:8,h:60,activated:false});
            }else if(ch==='6'||ch==='7'||ch==='8'){
                const type=ch==='6'?'life':ch==='7'?'star':'speed';
                let by=y;
                if(row>=map.length-2) by=y-TILE*2;
                const belowY=by+TILE;
                const hasBlockBelow=blocks.some(b=>b.x===x&&b.y===belowY);
                bonusBlocks.push({x,y:by,w:TILE,h:TILE,type,used:false,bumpTimer:0,hasBlockBelow});
            }else if(ch==='9'){
                if(Math.abs(x-SPAWN_X)<120)continue;
                hedgehogs.push({x:x+5,y:y+TILE-26,w:30,h:26,vx:-ENEMY_SPEED*.8,vy:0,alive:true});
            }else if(ch==='a'){
                flyingEnemies.push({x,y:y+5,w:30,h:24,baseY:y+5,phase:Math.random()*Math.PI*2,speed:.03,alive:true});
            }else if(ch==='B'){
                boss={x:x+5,y:y+TILE-70,w:60,h:70,vx:-1.0,vy:0,hp:5,maxHp:5,alive:true,hurtTimer:0,jumpTimer:0};
            }
        }
    }

    player.x=SPAWN_X;player.y=SPAWN_Y;player.vx=0;player.vy=0;
    player.onGround=true;player.finished=false;player.dead=false;
    player.invulnerable=0;player.animTimer=0;player.facing=1;
    player.starTimer=0;player.speedTimer=0;player.jumpCount=0;
    jumpBuffer=0;
    checkpoint={x:SPAWN_X,y:SPAWN_Y};
    particles=[];floatTexts=[];camera.x=0;camera.y=0;camera.shakeTimer=0;
    levelDisplay.textContent=index+1;
    hud.classList.remove('hidden');
    controls.classList.remove('hidden');
    document.getElementById('pauseBtnFloat').classList.remove('hidden');
}

function shakeScreen(i,d){camera.shakeTimer=d;camera.shakeIntensity=i;}

function updateCamera(){
    const targetX=player.x+player.w/2-VIEW_W/2;
    camera.x+=(targetX-camera.x)*.1;
    if(camera.x<0)camera.x=0;
    if(camera.x>levelWidth-VIEW_W)camera.x=Math.max(0,levelWidth-VIEW_W);
    if(camera.shakeTimer>0){
        camera.shakeTimer--;
        const inten=camera.shakeIntensity*(camera.shakeTimer/20);
        camera.shakeX=(Math.random()-.5)*inten;
        camera.shakeY=(Math.random()-.5)*inten;
    }else{camera.shakeX=0;camera.shakeY=0;}
}

function rectsIntersect(a,b){
    return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function updateEnemies(){
    for(const enemy of enemies){
        if(!enemy.alive){if(enemy.squashTimer>0)enemy.squashTimer--;continue;}
        enemy.x+=enemy.vx;
        for(const block of blocks){
            if(rectsIntersect(enemy,block)){
                if(enemy.vx>0)enemy.x=block.x-enemy.w;
                else if(enemy.vx<0)enemy.x=block.x+block.w;
                enemy.vx=-enemy.vx;
            }
        }
        if(enemy.x<0){enemy.x=0;enemy.vx=ENEMY_SPEED;}
        if(enemy.x+enemy.w>levelWidth){enemy.x=levelWidth-enemy.w;enemy.vx=-ENEMY_SPEED;}
        enemy.vy+=GRAVITY;
        if(enemy.vy>MAX_FALL)enemy.vy=MAX_FALL;
        enemy.y+=enemy.vy;
        for(const block of blocks){
            if(rectsIntersect(enemy,block)){
                if(enemy.vy>0){enemy.y=block.y-enemy.h;enemy.vy=0;}
                else if(enemy.vy<0){enemy.y=block.y+block.h;enemy.vy=0;}
            }
        }
        if(enemy.y>canvas.height+200)enemy.alive=false;
    }

    for(const hg of hedgehogs){
        if(!hg.alive)continue;
        hg.x+=hg.vx;
        for(const block of blocks){
            if(rectsIntersect(hg,block)){
                if(hg.vx>0)hg.x=block.x-hg.w;
                else if(hg.vx<0)hg.x=block.x+block.w;
                hg.vx=-hg.vx;
            }
        }
        if(hg.x<0){hg.x=0;hg.vx=ENEMY_SPEED*.8;}
        if(hg.x+hg.w>levelWidth){hg.x=levelWidth-hg.w;hg.vx=-ENEMY_SPEED*.8;}
        hg.vy+=GRAVITY;
        if(hg.vy>MAX_FALL)hg.vy=MAX_FALL;
        hg.y+=hg.vy;
        for(const block of blocks){
            if(rectsIntersect(hg,block)){
                if(hg.vy>0){hg.y=block.y-hg.h;hg.vy=0;}
                else if(hg.vy<0){hg.y=block.y+block.h;hg.vy=0;}
            }
        }
        if(hg.y>canvas.height+200)hg.alive=false;
    }

    for(const fe of flyingEnemies){
        if(!fe.alive)continue;
        fe.phase+=fe.speed;
        fe.x-=.8;
        fe.y=fe.baseY+Math.sin(fe.phase)*40;
        if(fe.x<-50){fe.x=levelWidth-40;fe.baseY=80+Math.random()*150;}
    }

    if(boss&&boss.alive){
        if(boss.hurtTimer>0)boss.hurtTimer--;
        boss.x+=boss.vx;
        const bossMinX=levelWidth-350,bossMaxX=levelWidth-100;
        if(boss.x<bossMinX){boss.x=bossMinX;boss.vx=Math.abs(boss.vx);}
        if(boss.x+boss.w>bossMaxX){boss.x=bossMaxX-boss.w;boss.vx=-Math.abs(boss.vx);}
        boss.jumpTimer++;
        if(boss.jumpTimer>120&&boss.vy===0){boss.vy=-8;boss.jumpTimer=0;}
        boss.vy+=GRAVITY;
        if(boss.vy>MAX_FALL)boss.vy=MAX_FALL;
        boss.y+=boss.vy;
        for(const block of blocks){
            if(rectsIntersect(boss,block)){
                if(boss.vy>0){boss.y=block.y-boss.h;boss.vy=0;}
                else if(boss.vy<0){boss.y=block.y+block.h;boss.vy=0;}
            }
        }
    }
}

function hitBonusBlock(bb){
    if(bb.used)return;
    bb.used=true;
    bb.bumpTimer=15;
    sfxPowerup();
    if(bb.type==='life'){
        lives++;livesDisplay.textContent=lives;
        spawnFloatText(bb.x+TILE/2,bb.y-20,'+1 ЖИЗНЬ','#ff6b6b');
        spawnParticles(bb.x+TILE/2,bb.y+TILE/2,'#ff6b6b',15,4,30);
    }else if(bb.type==='star'){
        player.starTimer=300;
        spawnFloatText(bb.x+TILE/2,bb.y-20,'ЗВЕЗДА!','#ffd966');
        spawnParticles(bb.x+TILE/2,bb.y+TILE/2,'#ffd966',15,4,30);
    }else if(bb.type==='speed'){
        player.speedTimer=300;
        spawnFloatText(bb.x+TILE/2,bb.y-20,'УСКОРЕНИЕ!','#8acd8a');
        spawnParticles(bb.x+TILE/2,bb.y+TILE/2,'#8acd8a',15,4,30);
    }
}

function checkEnemyCollisions(){
    if(player.dead)return;
    const starActive=player.starTimer>0;

    for(const enemy of enemies){
        if(!enemy.alive)continue;
        if(rectsIntersect(player,enemy)){
            if(starActive){
                enemy.alive=false;enemy.squashTimer=20;score+=50;updateScore();
                spawnParticles(enemy.x+enemy.w/2,enemy.y+enemy.h/2,'#ffd966',8,4,25);continue;
            }
            const pb=player.y+player.h;
            if(player.vy>0&&pb-player.vy<=enemy.y+12){
                enemy.alive=false;enemy.squashTimer=20;
                player.vy=JUMP_FORCE*.6;sfxStomp();
                spawnParticles(enemy.x+enemy.w/2,enemy.y+enemy.h/2,'#cc3333',8,4,25);
                spawnFloatText(enemy.x+enemy.w/2,enemy.y,'+50','#ff8844');
                score+=50;updateScore();
            }else if(player.invulnerable<=0){playerDied();}
        }
    }

    for(const hg of hedgehogs){
        if(!hg.alive)continue;
        if(rectsIntersect(player,hg)){
            if(starActive){
                hg.alive=false;score+=80;updateScore();
                spawnParticles(hg.x+hg.w/2,hg.y+hg.h/2,'#ffd966',8,4,25);continue;
            }
            if(player.invulnerable<=0)playerDied();
        }
    }

    for(const fe of flyingEnemies){
        if(!fe.alive)continue;
        if(rectsIntersect(player,fe)){
            if(starActive){
                fe.alive=false;score+=70;updateScore();
                spawnParticles(fe.x+fe.w/2,fe.y+fe.h/2,'#ffd966',8,4,25);continue;
            }
            if(player.vy>0&&player.y+player.h-player.vy<=fe.y+12){
                fe.alive=false;player.vy=JUMP_FORCE*.6;sfxStomp();
                score+=70;updateScore();
                spawnParticles(fe.x+fe.w/2,fe.y+fe.h/2,'#aa66ff',8,4,25);
                spawnFloatText(fe.x+fe.w/2,fe.y,'+70','#aa66ff');
            }else if(player.invulnerable<=0){playerDied();}
        }
    }

    if(boss&&boss.alive){
        if(rectsIntersect(player,boss)){
            const pb=player.y+player.h;
            const fellOnHead=player.vy>0&&(pb-player.vy)<=boss.y+boss.h*.6;
            if(fellOnHead){
                if(boss.hurtTimer<=0){
                    boss.hp--;boss.hurtTimer=40;
                    player.vy=JUMP_FORCE*.9;player.y=boss.y-player.h-2;
                    sfxBoss();shakeScreen(8,15);
                    spawnParticles(boss.x+boss.w/2,boss.y,'#ff4444',12,5,30);
                    spawnFloatText(boss.x+boss.w/2,boss.y-10,'-1 HP','#ff4444');
                    if(boss.hp<=0){
                        boss.alive=false;score+=500;updateScore();sfxWin();shakeScreen(15,25);
                        spawnParticles(boss.x+boss.w/2,boss.y+boss.h/2,'#ffd966',30,6,50);
                        spawnFloatText(boss.x+boss.w/2,boss.y,'+500','#ffd966');
                    }
                }else{player.vy=JUMP_FORCE*.7;}
            }else if(player.invulnerable<=0&&player.starTimer<=0){playerDied();}
        }
    }
}

function updateScore(){
    scoreDisplay.textContent=score;
    if(score>record){record=score;localStorage.setItem('pixel_plumber_record',record);recordDisplay.textContent=record;}
}

function playerDied(){
    if(player.dead||player.starTimer>0)return;
    player.dead=true;lives--;livesDisplay.textContent=lives;
    sfxDeath();shakeScreen(12,20);
    spawnParticles(player.x+player.w/2,player.y+player.h/2,'#ff4444',12,6,30);
    if(lives<=0){
        gameState='gameOver';stopMusic();
        setTimeout(()=>goToMenu(),2000);
    }else{
        setTimeout(()=>{
            if(gameState==='playing'){
                player.x=checkpoint.x;player.y=checkpoint.y;player.vx=0;player.vy=0;
                player.onGround=true;player.dead=false;player.invulnerable=90;
                player.starTimer=0;player.speedTimer=0;jumpBuffer=0;
                camera.x=Math.max(0,checkpoint.x-VIEW_W/2+player.w/2);
            }
        },600);
    }
}

function update(){
    if(gameState!=='playing')return;
    if(player.finished)return;
    if(player.invulnerable>0)player.invulnerable--;
    if(player.starTimer>0)player.starTimer--;
    if(player.speedTimer>0)player.speedTimer--;
    if(jumpBuffer>0)jumpBuffer--;
    if(player.dead){updateParticles();updateFloatTexts();updateEnemies();return;}

    const currentSpeed=player.speedTimer>0?MOVE_SPEED*1.8:MOVE_SPEED;
    if(keys.left){player.vx=-currentSpeed;player.facing=-1;}
    else if(keys.right){player.vx=currentSpeed;player.facing=1;}
    else player.vx=0;

    // Буферный прыжок
    if(jumpBuffer>0&&player.onGround){
        player.vy=JUMP_FORCE;player.onGround=false;player.jumpCount=1;
        jumpBuffer=0;
        sfxJump();
    } else if(keys.jump&&player.onGround){
        player.vy=JUMP_FORCE;player.onGround=false;player.jumpCount=1;
        sfxJump();
    }

    // Двойной прыжок (только с бонусом)
    if(keys.jump&&!player.onGround&&player.jumpCount<2&&(player.starTimer>0||player.speedTimer>0)){
        // Тут нужен отдельный триггер нажатия, но для простоты сделаем так:
        // если игрок в воздухе и нажат прыжок, и есть бонус — считаем как двойной
        // Чтобы не срабатывало каждый кадр — используем флаг wasPressed
        // (в этой версии реализовано через pointerdown в setupControls)
    }

    player.vy+=GRAVITY;
    if(player.vy>MAX_FALL)player.vy=MAX_FALL;

    // === X ===
    player.x+=player.vx;
    for(const block of blocks){
        if(rectsIntersect(player,block)){
            if(player.vx>0)player.x=block.x-player.w;
            else if(player.vx<0)player.x=block.x+block.w;
            player.vx=0;
        }
    }
    for(const bb of bonusBlocks){
        if(rectsIntersect(player,bb)){
            if(player.vx>0)player.x=bb.x-player.w;
            else if(player.vx<0)player.x=bb.x+bb.w;
            player.vx=0;
        }
    }

    // === Y ===
    player.y+=player.vy;
    player.onGround=false;

    let hitBlockBelowBonus=null;
    for(const block of blocks){
        if(rectsIntersect(player,block)){
            if(player.vy>0){
                if(player.vy>6)spawnParticles(player.x+player.w/2,player.y+player.h,'#8888aa',4,2,12);
                player.y=block.y-player.h;player.vy=0;player.onGround=true;player.jumpCount=0;
            }else if(player.vy<0){
                player.y=block.y+block.h;player.vy=0;
                sfxBump();
                for(const bb of bonusBlocks){
                    if(!bb.used&&bb.x===block.x&&bb.y+TILE===block.y){
                        hitBlockBelowBonus=bb;
                    }
                }
            }
        }
    }

    for(const bb of bonusBlocks){
        if(rectsIntersect(player,bb)){
            if(player.vy<0){
                player.y=bb.y+bb.h;player.vy=0;
                if(!bb.used){hitBonusBlock(bb);}
                else{sfxBump();}
            }else if(player.vy>0){
                player.y=bb.y-player.h;player.vy=0;player.onGround=true;player.jumpCount=0;
            }else{
                if(player.vx>0)player.x=bb.x-player.w;
                else if(player.vx<0)player.x=bb.x+bb.w;
                player.vx=0;
            }
        }
    }

    if(hitBlockBelowBonus)hitBonusBlock(hitBlockBelowBonus);

    for(const bb of bonusBlocks){if(bb.bumpTimer>0)bb.bumpTimer--;}

    if(player.x<0){player.x=0;player.vx=0;}
    if(player.x+player.w>levelWidth){player.x=levelWidth-player.w;player.vx=0;}
    if(player.y>canvas.height+100)playerDied();

    updateEnemies();checkEnemyCollisions();collectCoins();checkCheckpoints();checkGoal();
    updateParticles();updateFloatTexts();updateCamera();
    player.animTimer+=.2;
}

function collectCoins(){
    for(const coin of coinItems){
        if(!coin.collected&&rectsIntersect(player,coin)){
            coin.collected=true;coinsCollected++;score+=10;
            coinDisplay.textContent=coinsCollected;updateScore();sfxCoin();
            spawnParticles(coin.x+coin.w/2,coin.y+coin.h/2,'#ffd966',6,3,20);
            spawnFloatText(coin.x+coin.w/2,coin.y,'+10','#ffd966');
        }
        coin.animTimer+=.1;
    }
}

function checkCheckpoints(){
    for(const cp of checkpoints){
        if(!cp.activated&&rectsIntersect(player,cp)){
            cp.activated=true;
            checkpoint={x:cp.x-player.w/2+4,y:cp.y+60-player.h};
            sfxCheckpoint();
            spawnFloatText(cp.x,cp.y,'ЧЕКПОИНТ!','#8acd8a');
            spawnParticles(cp.x,cp.y+30,'#8acd8a',10,4,30);
        }
    }
}

function checkGoal(){
    if(player.finished)return;
    if(boss&&boss.alive)return;
    if(rectsIntersect(player,goal)){
        player.finished=true;player.vx=0;player.vy=0;
        score+=100;updateScore();sfxLevelComplete();
        spawnParticles(goal.x+goal.w/2,goal.y+goal.h/2,'#ffd966',15,5,40);
        if(currentLevel<LEVELS.length-1){
            gameState='levelComplete';
            setTimeout(()=>{currentLevel++;loadLevel(currentLevel);},1200);
        }else{
            gameState='gameComplete';stopMusic();
        }
    }
}

// ===== ОТРИСОВКА =====
function drawBackground(){
    const grad=ctx.createLinearGradient(0,0,0,canvas.height);
    const palettes=[
        ['#0b0b1a','#1a1a3a','#2a2a5a'],
        ['#0a0a1a','#2a1a3a','#3a1a4a'],
        ['#0a1a0a','#1a3a1a','#2a5a2a'],
        ['#1a0a0a','#3a1a1a','#5a2a2a'],
        ['#0a1a1a','#1a3a3a','#2a5a5a'],
        ['#1a1a0a','#3a3a1a','#5a5a2a'],
        ['#1a0a1a','#3a1a3a','#5a2a5a'],
        ['#0a0a2a','#1a1a4a','#2a2a6a'],
        ['#2a0a0a','#4a1a1a','#6a2a2a'],
        ['#000000','#1a0a2a','#3a0a4a']
    ];
    const p=palettes[currentLevel%10];
    grad.addColorStop(0,p[0]);grad.addColorStop(.6,p[1]);grad.addColorStop(1,p[2]);
    ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle='#ffffff88';
    for(let i=0;i<40;i++){
        const sx=((i*137)%levelWidth)-camera.x*.3;
        const sy=(i*89)%(canvas.height*.7);
        const wrappedX=((sx%canvas.width)+canvas.width)%canvas.width;
        ctx.fillRect(wrappedX,sy,2,2);
    }

    ctx.fillStyle='#ffd96633';ctx.beginPath();
    ctx.arc(currentLevel%2===0?700:150,60,30,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd96655';ctx.beginPath();
    ctx.arc(currentLevel%2===0?700:150,60,20,0,Math.PI*2);ctx.fill();
}

function drawBlocks(){
    const leftEdge=camera.x-50,rightEdge=camera.x+VIEW_W+50;
    for(const block of blocks){
        if(block.x+block.w<leftEdge||block.x>rightEdge)continue;
        const bx=block.x-camera.x,by=block.y-camera.y;
        ctx.fillStyle='#5a3a1a';ctx.fillRect(bx,by,block.w,block.h);
        ctx.fillStyle='#8a6a3a';ctx.fillRect(bx,by,block.w,5);
        ctx.fillStyle='#7a5a2a';ctx.fillRect(bx,by,5,block.h);
        ctx.strokeStyle='#2a1a0a';ctx.lineWidth=2;ctx.strokeRect(bx+1,by+1,block.w-2,block.h-2);
        ctx.strokeStyle='#6a4a2a';ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(bx+8,by+8);ctx.lineTo(bx+block.w-8,by+block.h-8);
        ctx.moveTo(bx+block.w-8,by+8);ctx.lineTo(bx+8,by+block.h-8);
        ctx.stroke();
        ctx.fillStyle='#3a2a0a';
        ctx.fillRect(bx+3,by+3,3,3);ctx.fillRect(bx+block.w-6,by+3,3,3);
        ctx.fillRect(bx+3,by+block.h-6,3,3);ctx.fillRect(bx+block.w-6,by+block.h-6,3,3);
    }
}

function drawBonusBlocks(){
    for(const bb of bonusBlocks){
        if(bb.x<camera.x-50||bb.x>camera.x+VIEW_W+50)continue;
        const bx=bb.x-camera.x;
        let by=bb.y-camera.y;
        if(bb.bumpTimer>0)by-=Math.sin((15-bb.bumpTimer)/15*Math.PI)*10;
        let color='#ffd966',symbol='?',border='#b8860b';
        if(bb.type==='life'){color='#ff6b6b';symbol='♥';border='#cc3333';}
        else if(bb.type==='star'){color='#ffd966';symbol='★';border='#b8860b';}
        else if(bb.type==='speed'){color='#8acd8a';symbol='⚡';border='#5a8a5a';}
        if(bb.used){
            ctx.fillStyle='#3a2a1a';ctx.fillRect(bx,by,bb.w,bb.h);
            ctx.strokeStyle='#2a1a0a';ctx.lineWidth=2;ctx.strokeRect(bx+1,by+1,bb.w-2,bb.h-2);
        }else{
            ctx.fillStyle=color;ctx.fillRect(bx,by,bb.w,bb.h);
            ctx.fillStyle='#ffffff44';ctx.fillRect(bx,by,bb.w,5);
            ctx.strokeStyle=border;ctx.lineWidth=3;ctx.strokeRect(bx+1,by+1,bb.w-2,bb.h-2);
            ctx.fillStyle='#000000';ctx.font='bold 26px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(symbol,bx+bb.w/2,by+bb.h/2+2);
        }
    }
}

function drawCoins(){
    for(const coin of coinItems){
        if(coin.collected)continue;
        if(coin.x<camera.x-40||coin.x>camera.x+VIEW_W+40)continue;
        const cx=coin.x+coin.w/2-camera.x,cy=coin.y+coin.h/2-camera.y;
        const scaleX=Math.abs(Math.cos(coin.animTimer));
        const r=coin.w/2;
        ctx.fillStyle='#ffd96633';ctx.beginPath();ctx.arc(cx,cy,r+6,0,Math.PI*2);ctx.fill();
        ctx.save();ctx.translate(cx,cy);ctx.scale(scaleX,1);
        ctx.fillStyle='#ffd966';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff8cc';ctx.beginPath();ctx.arc(-r*.3,-r*.3,r*.35,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#8b6508';ctx.font='bold 14px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('$',0,1);
        ctx.restore();
    }
}

function drawEnemies(){
    for(const enemy of enemies){
        if(!enemy.alive&&enemy.squashTimer<=0)continue;
        if(enemy.x<camera.x-60||enemy.x>camera.x+VIEW_W+60)continue;
        const ex=enemy.x-camera.x,ey=enemy.y-camera.y,ew=enemy.w,eh=enemy.h;
        if(!enemy.alive){
            const sy=ey+eh-10;
            ctx.fillStyle='#cc3333';ctx.beginPath();ctx.ellipse(ex+ew/2,sy+3,ew/2+2,6,0,Math.PI,0);ctx.fill();continue;
        }
        ctx.fillStyle='#cc3333';ctx.beginPath();ctx.ellipse(ex+ew/2,ey+eh*.4,ew/2,eh*.45,0,Math.PI,0);ctx.fill();
        ctx.fillStyle='#992222';ctx.fillRect(ex+2,ey+eh*.35,ew-4,4);
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(ex+ew*.25,ey+eh*.3,4,0,Math.PI*2);
        ctx.arc(ex+ew*.75,ey+eh*.3,4,0,Math.PI*2);
        ctx.arc(ex+ew*.5,ey+eh*.15,3.5,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#f5e6c8';ctx.fillRect(ex+ew*.25,ey+eh*.5,ew*.5,eh*.4);
        ctx.fillStyle='#000000';
        ctx.fillRect(ex+ew*.35,ey+eh*.6,3,4);
        ctx.fillRect(ex+ew*.6,ey+eh*.6,3,4);
        ctx.fillStyle='#442200';ctx.fillRect(ex+ew*.15,ey+eh-4,ew*.7,4);
    }

    for(const hg of hedgehogs){
        if(!hg.alive)continue;
        if(hg.x<camera.x-60||hg.x>camera.x+VIEW_W+60)continue;
        const hx=hg.x-camera.x,hy=hg.y-camera.y,hw=hg.w,hh=hg.h;
        ctx.fillStyle='#8a5a3a';ctx.beginPath();ctx.ellipse(hx+hw/2,hy+hh*.7,hw/2,hh*.35,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#4a2a1a';
        for(let i=0;i<5;i++){
            const sx=hx+hw*.15+i*hw*.175;
            ctx.beginPath();
            ctx.moveTo(sx,hy+hh*.5);ctx.lineTo(sx+4,hy+hh*.15);ctx.lineTo(sx+8,hy+hh*.5);
            ctx.fill();
        }
        ctx.fillStyle='#000000';
        ctx.beginPath();ctx.arc(hx+hw*.75,hy+hh*.65,3,0,Math.PI*2);ctx.fill();
        ctx.fillRect(hx+hw*.9,hy+hh*.7,3,3);
    }

    for(const fe of flyingEnemies){
        if(!fe.alive)continue;
        if(fe.x<camera.x-60||fe.x>camera.x+VIEW_W+60)continue;
        const fx=fe.x-camera.x,fy=fe.y-camera.y,fw=fe.w,fh=fe.h;
        ctx.fillStyle='#aa66ff';ctx.beginPath();ctx.ellipse(fx+fw/2,fy+fh/2,fw/2,fh/2,0,0,Math.PI*2);ctx.fill();
        const wp=Math.sin(Date.now()/100)*8;
        ctx.fillStyle='#cc99ff';
        ctx.beginPath();ctx.ellipse(fx+fw*.2,fy+fh/2+wp,fw*.3,fh*.4,-.3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(fx+fw*.8,fy+fh/2+wp,fw*.3,fh*.4,.3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(fx+fw*.35,fy+fh*.4,3,0,Math.PI*2);
        ctx.arc(fx+fw*.65,fy+fh*.4,3,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#000000';
        ctx.beginPath();
        ctx.arc(fx+fw*.35,fy+fh*.4,1.5,0,Math.PI*2);
        ctx.arc(fx+fw*.65,fy+fh*.4,1.5,0,Math.PI*2);
        ctx.fill();
    }

    if(boss&&boss.alive){
        const bx=boss.x-camera.x,by=boss.y-camera.y,bw=boss.w,bh=boss.h;
        if(boss.hurtTimer>0&&Math.floor(boss.hurtTimer/4)%2===0)return;
        ctx.fillStyle='#aa2222';ctx.beginPath();ctx.ellipse(bx+bw/2,by+bh*.55,bw/2,bh*.4,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#cc3333';ctx.beginPath();ctx.ellipse(bx+bw/2,by+bh*.3,bw/2,bh*.3,0,Math.PI,0);ctx.fill();
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(bx+bw*.25,by+bh*.2,7,0,Math.PI*2);
        ctx.arc(bx+bw*.75,by+bh*.2,7,0,Math.PI*2);
        ctx.arc(bx+bw*.5,by+bh*.1,6,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(bx+bw*.35,by+bh*.5,7,0,Math.PI*2);
        ctx.arc(bx+bw*.65,by+bh*.5,7,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#000000';
        ctx.beginPath();
        ctx.arc(bx+bw*.38,by+bh*.52,3.5,0,Math.PI*2);
        ctx.arc(bx+bw*.68,by+bh*.52,3.5,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='#000000';ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(bx+bw*.25,by+bh*.4);ctx.lineTo(bx+bw*.42,by+bh*.45);
        ctx.moveTo(bx+bw*.75,by+bh*.4);ctx.lineTo(bx+bw*.58,by+bh*.45);
        ctx.stroke();
        ctx.strokeStyle='#000000';ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(bx+bw*.4,by+bh*.7);ctx.lineTo(bx+bw*.6,by+bh*.7);
        ctx.stroke();
        const hpW=80,hpH=8,hpX=bx+bw/2-hpW/2,hpY=by-20;
        ctx.fillStyle='#000000';ctx.fillRect(hpX-1,hpY-1,hpW+2,hpH+2);
        ctx.fillStyle='#5a1a1a';ctx.fillRect(hpX,hpY,hpW,hpH);
        ctx.fillStyle='#ff3333';ctx.fillRect(hpX,hpY,hpW*(boss.hp/boss.maxHp),hpH);
        ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.strokeRect(hpX,hpY,hpW,hpH);
    }
}

function drawCheckpoints(){
    for(const cp of checkpoints){
        if(cp.x<camera.x-50||cp.x>camera.x+VIEW_W+50)continue;
        const cx=cp.x-camera.x,cy=cp.y-camera.y;
        ctx.fillStyle='#c0c0c0';ctx.fillRect(cx,cy,cp.w,cp.h);
        const color=cp.activated?'#8acd8a':'#6666aa';
        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.moveTo(cx+cp.w,cy+4);ctx.lineTo(cx+cp.w+20,cy+12);ctx.lineTo(cx+cp.w,cy+20);
        ctx.closePath();ctx.fill();
        ctx.fillStyle=cp.activated?'#ffd966':'#8888aa';
        ctx.beginPath();ctx.arc(cx+cp.w/2,cy-3,5,0,Math.PI*2);ctx.fill();
    }
}

function drawGoal(){
    if(goal.x<camera.x-60||goal.x>camera.x+VIEW_W+60)return;
    const poleX=goal.x+goal.w/2-2-camera.x,poleTop=goal.y-camera.y;
    ctx.fillStyle='#c0c0c0';ctx.fillRect(poleX,poleTop,4,goal.h);
    const wave=Math.sin(Date.now()/200)*4;
    ctx.fillStyle='#ff4444';
    ctx.beginPath();
    ctx.moveTo(poleX+4,poleTop+4);ctx.lineTo(poleX+4+30,poleTop+12+wave);ctx.lineTo(poleX+4,poleTop+24);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd966';
    ctx.beginPath();ctx.arc(poleX+2,poleTop-2,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd96622';
    ctx.beginPath();ctx.arc(goal.x+goal.w/2-camera.x,goal.y+goal.h/2-camera.y,30,0,Math.PI*2);ctx.fill();
}

function drawPlayer(){
    if(player.invulnerable>0&&Math.floor(player.invulnerable/4)%2===0)return;
    if(player.starTimer>0&&Math.floor(player.starTimer/4)%2===0)return;
    const px=player.x-camera.x,py=player.y-camera.y,pw=player.w,ph=player.h;
    if(player.starTimer>0){
        ctx.fillStyle=`hsla(${(Date.now()/5)%360},100%,70%,0.3)`;
        ctx.beginPath();ctx.arc(px+pw/2,py+ph/2,pw,0,Math.PI*2);ctx.fill();
    }
    if(player.speedTimer>0){
        ctx.fillStyle='#8acd8a44';
        ctx.beginPath();ctx.arc(px+pw/2,py+ph/2,pw*.9,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#00000044';
    ctx.beginPath();ctx.ellipse(px+pw/2,py+ph+2,pw*.6,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2266cc';ctx.fillRect(px+4,py+14,pw-8,ph-14);
    ctx.fillStyle='#ffcc99';ctx.fillRect(px+6,py,pw-12,16);
    ctx.fillStyle='#cc3333';ctx.fillRect(px+4,py-2,pw-8,8);
    if(player.facing===1)ctx.fillRect(px+pw-10,py+2,10,4);
    else ctx.fillRect(px,py+2,10,4);
    ctx.fillStyle='#000000';
    if(player.facing===1)ctx.fillRect(px+pw-12,py+5,3,4);
    else ctx.fillRect(px+9,py+5,3,4);
    ctx.fillStyle='#ffcc00';
    ctx.fillRect(px+4,py+22,pw-8,4);
    ctx.fillRect(px+pw/2-5,py+16,3,3);
    ctx.fillRect(px+pw/2+2,py+16,3,3);
    const wp=Math.sin(player.animTimer)*4;
    ctx.fillStyle='#1a1a6a';
    if(player.onGround&&(keys.left||keys.right)){
        ctx.fillRect(px+4,py+ph-8+wp,8,10);
        ctx.fillRect(px+pw-12,py+ph-8-wp,8,10);
    }else{
        ctx.fillRect(px+4,py+ph-8,8,10);
        ctx.fillRect(px+pw-12,py+ph-8,8,10);
    }
    ctx.fillStyle='#442200';
    if(player.onGround&&(keys.left||keys.right)){
        ctx.fillRect(px+2,py+ph-2+wp,10,4);
        ctx.fillRect(px+pw-12,py+ph-2-wp,10,4);
    }else{
        ctx.fillRect(px+2,py+ph-2,10,4);
        ctx.fillRect(px+pw-12,py+ph-2,10,4);
    }
}

function drawMenu(){
    const grad=ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,'#0b0b1a');grad.addColorStop(.6,'#1a1a3a');grad.addColorStop(1,'#2a2a5a');
    ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ffffff88';
    for(let i=0;i<40;i++)ctx.fillRect((i*137)%canvas.width,(i*89)%canvas.height,3,3);
    ctx.fillStyle='#ffd966';ctx.font='bold 36px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#ff6b6b';ctx.shadowBlur=15;
    ctx.fillText('PIXEL',canvas.width/2,30);
    ctx.fillStyle='#ff6b6b';ctx.fillText('PLUMBER',canvas.width/2,62);
    ctx.shadowBlur=0;

    menuButtons=[];
    const cx=canvas.width/2,startY=90;
    const btnW=130,btnH=36,gapX=10,gapY=8;
    const totalW=5*btnW+4*gapX,startX=cx-totalW/2;
    const levelDescs=['ПРОСТОЙ','ПЛАТФОРМЫ','ГРИБЫ','СЛОЖНЫЙ','ЁЖИКИ','ЛЕТУНЫ','БОНУСЫ','КОМБО','ПОЧТИ ФИНАЛ','БОСС!'];

    for(let i=0;i<10;i++){
        const col=i%5,row=Math.floor(i/5);
        const x=startX+col*(btnW+gapX),y=startY+row*(btnH+gapY+12);
        let bg='#4a4a6a',border='#8a8acd';
        if(i<3){bg='#4a6a4a';border='#8acd8a';}
        else if(i<6){bg='#6a4a4a';border='#cd8a8a';}
        else if(i<9){bg='#6a6a4a';border='#cdcd8a';}
        else{bg='#8a3a8a';border='#cd6acd';}
        drawMenuButton(x,y,btnW,btnH,'УР '+(i+1),bg,border,14);
        ctx.fillStyle='#aaaaff';ctx.font='bold 8px "Courier New"';ctx.textAlign='center';
        ctx.fillText(levelDescs[i],x+btnW/2,y+btnH+7);
        menuButtons.push({x,y,w:btnW,h:btnH,action:()=>{initAudio();startLevel(i);startMusic();}});
    }

    const helpBtnY=startY+2*(btnH+gapY+12)+15;
    drawMenuButton(cx-140,helpBtnY,280,36,'КАК ИГРАТЬ','#3a3a5a','#7a7aad',14);
    menuButtons.push({x:cx-140,y:helpBtnY,w:280,h:36,action:()=>{previousState='menu';gameState='help';}});

    ctx.fillStyle='#aaaaff';ctx.font='bold 10px "Courier New"';ctx.textAlign='center';
    ctx.fillText('Прыгай на грибы! Бей головой бонус-блоки!',cx,canvas.height-12);
}

function drawHelp(){
    ctx.fillStyle='#0b0b1a';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ffd966';ctx.font='bold 28px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('УПРАВЛЕНИЕ',canvas.width/2,30);
    ctx.font='bold 13px "Courier New"';ctx.textAlign='left';
    const lines=[
        ['◀ ▶  — Движение','#ffffff'],
        ['⬆    — Прыжок (двойной с бонусом)','#ffffff'],
        ['❚❚   — Пауза  |  ESC — Меню','#ffffff'],
        ['',''],
        ['• Прыгай на грибы/летунов сверху — они гибнут','#8acd8a'],
        ['• Ёжиков нельзя топтать — только обходить!','#cd8a8a'],
        ['• Бонус-блоки: ударь ГОЛОВОЙ СНИЗУ!','#ffd966'],
        ['  Также работают через блок под ними.','#ffd966'],
        ['   ♥ — +1 жизнь    ★ — звезда (5 сек)','#ffd966'],
        ['   ⚡ — ускорение + двойной прыжок','#ffd966'],
        ['• Собирай монеты: +10   Грибы: +50','#ffffff'],
        ['• Ёжики: +80   Летуны: +70   Босс: +500','#ffffff'],
        ['• Флажок — чекпоинт','#8acd8a'],
        ['• Босс: 5 прыжков сверху, но осторожно —','#ff6b6b'],
        ['  если коснёшься сбоку — потеряешь жизнь!','#ff6b6b']
    ];
    let y=70;
    for(const [line,color] of lines){
        if(line===''){y+=8;continue;}
        ctx.fillStyle=color;ctx.fillText(line,50,y);y+=20;
    }
    const bw=200,bh=45,bx=canvas.width/2-bw/2,by=canvas.height-55;
    drawMenuButton(bx,by,bw,bh,'НАЗАД','#4a4a6a','#8a8acd',20);
    menuButtons=[{x:bx,y:by,w:bw,h:bh,action:()=>{gameState='menu';}}];
}

function drawMenuButton(x,y,w,h,text,bg,border,fontSize){
    ctx.fillStyle='#0f0f1f';ctx.fillRect(x+4,y+4,w,h);
    ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=border;ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
    ctx.fillStyle='#ffffff22';ctx.fillRect(x,y,w,h/3);
    ctx.fillStyle='#ffd966';ctx.font=`bold ${fontSize||24}px "Courier New"`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2+2);
}

function startLevel(index){currentLevel=index;loadLevel(index);}

function drawOverlay(){
    if(gameState==='paused'){
        ctx.fillStyle='#000000cc';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ffd966';ctx.font='bold 44px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('ПАУЗА',canvas.width/2,130);
        const bw=240,bh=55,gap=20,cx=canvas.width/2;
        drawMenuButton(cx-bw/2,220,bw,bh,'ПРОДОЛЖИТЬ','#4a6a4a','#8acd8a',20);
        drawMenuButton(cx-bw/2,220+bh+gap,bw,bh,'В МЕНЮ','#4a4a6a','#8a8acd',20);
        menuButtons=[
            {x:cx-bw/2,y:220,w:bw,h:bh,action:()=>{gameState=previousState;}},
            {x:cx-bw/2,y:220+bh+gap,w:bw,h:bh,action:()=>{stopMusic();goToMenu();}}
        ];
    }else if(gameState==='levelComplete'){
        ctx.fillStyle='#000000aa';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ffd966';ctx.font='bold 40px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('УРОВЕНЬ ПРОЙДЕН!',canvas.width/2,canvas.height/2-20);
        ctx.font='bold 20px "Courier New"';ctx.fillStyle='#ffffff';
        ctx.fillText('Загрузка следующего...',canvas.width/2,canvas.height/2+30);
    }else if(gameState==='gameComplete'){
        ctx.fillStyle='#000000cc';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ffd966';ctx.font='bold 36px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('🏆 ПОБЕДА! 🏆',canvas.width/2,canvas.height/2-80);
        ctx.font='bold 22px "Courier New"';ctx.fillStyle='#ffffff';
        ctx.fillText('Босс повержен!',canvas.width/2,canvas.height/2-40);
        ctx.fillText('Монет: '+coinsCollected,canvas.width/2,canvas.height/2);
        ctx.fillText('Очки: '+score,canvas.width/2,canvas.height/2+35);
        ctx.fillStyle='#cdcd8a';ctx.fillText('Рекорд: '+record,canvas.width/2,canvas.height/2+70);
        const bw=220,bh=55,bx=canvas.width/2-bw/2,by=canvas.height/2+105;
        drawMenuButton(bx,by,bw,bh,'В МЕНЮ','#4a4a6a','#8a8acd',22);
        menuButtons=[{x:bx,y:by,w:bw,h:bh,action:()=>goToMenu()}];
    }else if(gameState==='gameOver'){
        ctx.fillStyle='#000000dd';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ff4444';ctx.font='bold 44px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-30);
        ctx.font='bold 20px "Courier New"';ctx.fillStyle='#ffffff';
        ctx.fillText('Очки: '+score,canvas.width/2,canvas.height/2+15);
        ctx.fillText('Возврат в меню...',canvas.width/2,canvas.height/2+50);
    }
}

function goToMenu(){
    gameState='menu';menuButtons=[];coinsCollected=0;lives=3;score=0;
    coinDisplay.textContent='0';livesDisplay.textContent='3';scoreDisplay.textContent='0';
    recordDisplay.textContent=record;
    hud.classList.add('hidden');controls.classList.add('hidden');
    document.getElementById('pauseBtnFloat').classList.add('hidden');
    stopMusic();
}

function gameLoop(){
    if(gameState==='menu'){drawMenu();requestAnimationFrame(gameLoop);return;}
    if(gameState==='help'){drawHelp();requestAnimationFrame(gameLoop);return;}
    if(gameState==='paused'){
        drawBackground();drawBlocks();drawBonusBlocks();drawCoins();
        drawEnemies();drawCheckpoints();drawGoal();drawPlayer();
        drawParticles();drawFloatTexts();drawOverlay();
        requestAnimationFrame(gameLoop);return;
    }
    if(gameState==='gameComplete'||gameState==='gameOver'){
        if(gameState==='gameComplete'){
            drawBackground();drawBlocks();drawBonusBlocks();drawCoins();
            drawEnemies();drawCheckpoints();drawGoal();drawPlayer();
        }
        drawOverlay();requestAnimationFrame(gameLoop);return;
    }
    update();
    drawBackground();drawBlocks();drawBonusBlocks();drawCoins();
    drawEnemies();drawCheckpoints();drawGoal();drawPlayer();
    drawParticles();drawFloatTexts();drawOverlay();
    requestAnimationFrame(gameLoop);
}

function setupControls(){
    const leftBtn=document.getElementById('leftBtn');
    const rightBtn=document.getElementById('rightBtn');
    const jumpBtn=document.getElementById('jumpBtn');
    const pauseBtn=document.getElementById('pauseBtnFloat');

    function bind(el,onDown,onUp){
        let pressed=false;
        const start=e=>{
            e.preventDefault();initAudio();
            if(pressed)return;
            pressed=true;
            el.classList.add('pressed');
            onDown();
        };
        const end=e=>{
            e.preventDefault();
            if(!pressed)return;
            pressed=false;
            el.classList.remove('pressed');
            if(onUp)onUp();
        };
        el.addEventListener('pointerdown',start);
        el.addEventListener('pointerup',end);
        el.addEventListener('pointercancel',end);
        el.addEventListener('pointerleave',end);
    }

    bind(leftBtn,()=>{keys.left=true;},()=>{keys.left=false;});
    bind(rightBtn,()=>{keys.right=true;},()=>{keys.right=false;});
    bind(jumpBtn,()=>{
        keys.jump=true;
        jumpBuffer=8; // Активируем буфер прыжка при нажатии
        // Если в воздухе и есть бонус — двойной прыжок
        if(!player.onGround&&player.jumpCount<2&&(player.starTimer>0||player.speedTimer>0)){
            player.vy=JUMP_FORCE*.85;
            player.jumpCount++;
            sfxJump();
            spawnParticles(player.x+player.w/2,player.y+player.h,'#ffffff',5,3,15);
        }
    },()=>{keys.jump=false;});

    pauseBtn.addEventListener('click',e=>{
        e.preventDefault();initAudio();
        if(gameState==='playing'){previousState='playing';gameState='paused';}
        else if(gameState==='paused')gameState='playing';
    });

    canvas.addEventListener('touchstart',e=>{
        e.preventDefault();initAudio();
        const rect=canvas.getBoundingClientRect();
        const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
        const tx=(e.touches[0].clientX-rect.left)*sx;
        const ty=(e.touches[0].clientY-rect.top)*sy;
        for(const btn of menuButtons){
            if(tx>=btn.x&&tx<=btn.x+btn.w&&ty>=btn.y&&ty<=btn.y+btn.h){btn.action();return;}
        }
    },{passive:false});

    canvas.addEventListener('click',e=>{
        const rect=canvas.getBoundingClientRect();
        const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
        const tx=(e.clientX-rect.left)*sx;
        const ty=(e.clientY-rect.top)*sy;
        for(const btn of menuButtons){
            if(tx>=btn.x&&tx<=btn.x+btn.w&&ty>=btn.y&&ty<=btn.y+btn.h){btn.action();return;}
        }
    });

    window.addEventListener('keydown',e=>{
        initAudio();
        if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
        if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
        if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' '){
            if(!keys.jump){
                keys.jump=true;
                jumpBuffer=8;
                if(!player.onGround&&player.jumpCount<2&&(player.starTimer>0||player.speedTimer>0)){
                    player.vy=JUMP_FORCE*.85;
                    player.jumpCount++;
                    sfxJump();
                    spawnParticles(player.x+player.w/2,player.y+player.h,'#ffffff',5,3,15);
                }
            }
            e.preventDefault();
        }
        if(e.key==='Escape'){
            if(gameState==='playing'){previousState='playing';gameState='paused';}
            else if(gameState==='paused')gameState='playing';
            else if(gameState!=='menu')goToMenu();
        }
        if((e.key==='p'||e.key==='P')&&gameState==='playing'){previousState='playing';gameState='paused';}
    });
    window.addEventListener('keyup',e=>{
        if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
        if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
        if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' ')keys.jump=false;
    });
}

hud.classList.add('hidden');
controls.classList.add('hidden');
document.getElementById('pauseBtnFloat').classList.add('hidden');
recordDisplay.textContent=record;
setupControls();
gameLoop();
</script>
